syntax = "proto3";

package noti.v1;

import "google/protobuf/struct.proto";

service NotificationService {
  // Sends a notification asynchronously. 
  // Returns immediately with a notification ID.
  rpc SendNotification (SendNotificationRequest) returns (NotificationResponse);

  // Gets the status of a specific notification
  rpc GetNotificationStatus (GetNotificationStatusRequest) returns (NotificationStatusResponse);
}

enum Channel {
  EMAIL = 0;
  SMS = 1;
  PUSH = 2;
  WEBHOOK = 3;
  WEBSOCKET = 4;
}

message SendNotificationRequest {
  string user_id = 1; // Optional: user context
  Channel channel = 2;
  string recipient = 3; // Email address, phone number, or webhook URL
  string template_id = 4;
  string variables_json = 5; // JSON string of variables for the template
  string idempotency_key = 6;
}

message NotificationResponse {
  string notification_id = 1;
  string status = 2; // e.g., 'pending', 'accepted'
}

message GetNotificationStatusRequest {
  string notification_id = 1;
}

message NotificationStatusResponse {
  string notification_id = 1;
  string status = 2;
  string error_message = 3;
  string sent_at = 4; // ISO8601 string
}
