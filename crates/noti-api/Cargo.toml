[package]
name = "noti-api"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
noti-core.workspace = true
noti-protocol.workspace = true
noti-logic.workspace = true

connectrpc.workspace = true
buffa.workspace = true
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
async-trait.workspace = true

dashmap.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
tracing.workspace = true
jsonwebtoken.workspace = true
gridtokenx-blockchain-core.workspace = true

[dev-dependencies]
# Drive the Axum router in-process (ServiceExt::oneshot) for handler wiring tests.
tower = { workspace = true }
# Build sample Notification domain values (timestamp fields) in handler tests.
chrono = { workspace = true }
# WebSocket e2e: bind a real listener (`net`) and drive a real client handshake.
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = "0.29"
futures = { workspace = true }
# WebSocket full-flow e2e (tests/websocket_flow.rs): drive a notification through
# the real orchestrator → real `WebSocketProvider` → `ConnectionManager` → client.
noti-persistence = { workspace = true }
